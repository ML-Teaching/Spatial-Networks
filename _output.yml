bookdown::gitbook:
  css: assets/style.css
  highlight: kate
  toc_depth: 2
  config:
    toc:
      collapse: section
      before: |
        <li class="toc-logo">
          <a href="./" class="logo-link">
            <img src="assets/logo.png" width="100" alt="Logo">
            <span class="logo-text">Réseaux spatiaux</span>
          </a>
        </li>
      after: |
        <li><a href="https://github.com/ML-Teaching/Spatial-Networks" target="blank">Code source</a></li>
        <li><a href="https://bookdown.org/" target="blank">Publié avec bookdown</a></li>
        <li><a href="https://www.maximelenormand.com/" target="blank">Proposé par <strong>Maxime Lenormand</strong></a></li>
    info: no  
    sharing: no
    fontsettings: yes
    search: yes


  
